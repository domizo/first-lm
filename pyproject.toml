[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "first-lm"
version = "0.1.0"
description = "A genuine tiny Transformer learning lab"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["torch==2.13.0", "numpy>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["python"]
